spring:
  application:
    name: eva-server
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

forgejo:
  base-url: ${FORGEJO_BASE_URL}
  token: ${FORGEJO_TOKEN}
  connect-timeout: ${FORGEJO_CONNECT_TIMEOUT:15s}
  read-timeout: ${FORGEJO_READ_TIMEOUT:30s}

server:
  port: 8080
