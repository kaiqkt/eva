# Profile de desenvolvimento: ative com SPRING_PROFILES_ACTIVE=local
# Usa o Postgres do docker-compose (suba com `docker-compose up -d` antes).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/eva
    driver-class-name: org.postgresql.Driver
    username: eva
    password: eva

forgejo:
  base-url: http://localhost:3000
  # token herdado de application.yml (${FORGEJO_TOKEN}) — exporte no shell ou no .env,
  # nunca literal aqui: este arquivo é versionado.
  connect-timeout: 15s
  read-timeout: 30s

logging:
  level:
    dev.kaiqkt.eva: DEBUG
